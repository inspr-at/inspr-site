name: auth-image

# INSPR-253 — build the inspr-auth OIDC bridge from auth/ and publish it to
# GHCR so the image running on csb1 has a reproducible, versioned source.
#
#   pull_request touching auth/   build + vulnerability gate, no push
#   push to main touching auth/   scan, sign, then publish :main and :sha-<commit>
#   tag auth-vX.Y.Z               scan and sign, then publish immutable :X.Y.Z and :latest;
#                                 an already-published version fails the run
#
# Every published image carries BuildKit SLSA provenance and an SPDX SBOM and
# is signed keyless with cosign through this workflow's GitHub OIDC identity.
# As in pharos (OPS-88) the signing job stays on GitHub-hosted infrastructure,
# not on Blacksmith. The csb1 digest pin in nixcfg is not touched from here;
# moving it off the legacy rescue tag is a reviewed nixcfg change.

on:
  push:
    branches: [main]
    tags: ["auth-v*"]
    paths:
      - "auth/**"
      - ".github/workflows/auth-image.yml"
      - ".github/tests/test_auth_image_workflow.py"
  pull_request:
    paths:
      - "auth/**"
      - ".github/workflows/auth-image.yml"
      - ".github/tests/test_auth_image_workflow.py"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/inspr-at/inspr-site/inspr-auth
  SCAN_IMAGE: ghcr.io/inspr-at/inspr-site/inspr-auth:scan-${{ github.run_id }}-${{ github.run_attempt }}

permissions:
  contents: read
  packages: none
  id-token: none

concurrency:
  # Every publisher shares one non-cancelling lane. PRs retain per-ref
  # cancellation and cannot collide with it. Tag sets are also disjoint:
  # only the main-push authority can create immutable sha-* tags.
  group: auth-image-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-image:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: none
      id-token: none
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: test fail-closed publication contract
        run: .github/tests/test_auth_image_workflow.py

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=inspr-auth
            org.opencontainers.image.description=OIDC session and signup bridge for inspr.at (/enter, /login, /welcome, /logout)
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: build image for local scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: auth
          platforms: linux/amd64
          # The only pre-scan output is a runner-local staging name. Release
          # tags cannot reach GHCR through this build.
          push: false
          load: true
          tags: ${{ env.SCAN_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate (INSPR-307): any fixable CRITICAL or HIGH finding in the OS layer
      # or the Go binary fails the run, on pull requests (local image) as well
      # as on published images. 0.1.0 shipped report-only to mirror the
      # running rescue build; from 0.2.0 the toolchain and modules stay current.
      - name: scan image for fixable CRITICAL/HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          version: v0.72.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln

  publish-image:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: test fail-closed publication contract
        run: .github/tests/test_auth_image_workflow.py

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=raw,value=sha-${{ github.sha }},enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=match,pattern=auth-v(.*),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/auth-v') }}
            type=raw,value=manual-${{ github.run_id }}-${{ github.run_attempt }},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=inspr-auth
            org.opencontainers.image.description=OIDC session and signup bridge for inspr.at (/enter, /login, /welcome, /logout)
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: refuse version tag overwrite
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if output=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" 2>&1); then
            echo "error: ${IMAGE}:${VERSION} already exists and is immutable" >&2
            exit 1
          fi
          if ! grep -Eqi 'manifest unknown|not found|no such manifest|name unknown' <<<"$output"; then
            echo "error: could not prove that ${IMAGE}:${VERSION} is unused" >&2
            printf '%s\n' "$output" >&2
            exit 1
          fi

      - name: build image for local scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: auth
          platforms: linux/amd64
          # The only pre-scan output is a runner-local staging name. Release
          # tags cannot reach GHCR through this build.
          push: false
          load: true
          tags: ${{ env.SCAN_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate (INSPR-307): the release image must pass the same local scan as a
      # pull request before any registry write is attempted.
      - name: scan image for fixable CRITICAL/HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          version: v0.72.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln

      # A non-PR build is exported without a tag after the scan passes. Buildx
      # addresses it canonically by digest, preserving provenance and SBOM,
      # while the warmed cache makes this a no-op rebuild of the scanned input.
      - name: publish release image by digest
        id: release
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: auth
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: verify pushed image is the scanned image
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          SCANNED_CONFIG=$(docker image inspect --format '{{.Id}}' "${SCAN_IMAGE}")
          PLATFORM_DIGEST=$(
            docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .Manifest}}' |
              jq -er '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | if length == 1 then .[0].digest else error("expected exactly one linux/amd64 manifest") end'
          )
          PUSHED_CONFIG=$(
            docker buildx imagetools inspect --raw "${IMAGE}@${PLATFORM_DIGEST}" |
              jq -er '.config.digest'
          )
          if [ "${SCANNED_CONFIG}" != "${PUSHED_CONFIG}" ]; then
            echo "error: pushed image config does not match the image that passed Trivy" >&2
            exit 1
          fi

      - name: verify embedded provenance and SBOM
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          provenance=$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{ json .Provenance.SLSA }}')
          sbom=$(docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{ json .SBOM.SPDX }}')
          jq -e '
            .buildDefinition.buildType == "https://github.com/moby/buildkit/blob/master/docs/attestations/slsa-definitions.md"
            and (.buildDefinition.resolvedDependencies | type == "array" and length > 0)
            and (.runDetails.builder.id | type == "string" and length > 0)
          ' <<<"${provenance}" >/dev/null
          jq -e '
            .spdxVersion == "SPDX-2.3"
            and (.documentNamespace | type == "string" and length > 0)
            and (.packages | type == "array" and length > 0)
          ' <<<"${sbom}" >/dev/null

      - name: install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        with:
          cosign-release: v2.5.2

      - name: sign image digest with GitHub OIDC
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: verify image signature
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/auth-image.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" >/dev/null

      # Only a digest that passed the scan, identity/attestation checks, signing,
      # and signature verification receives the user-facing metadata tags.
      - name: publish signed tags
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "error: invalid release digest" >&2; exit 1; }
          mapfile -t tags < <(printf '%s\n' "${TAGS}" | sed '/^[[:space:]]*$/d')
          ((${#tags[@]} > 0)) || { echo "error: metadata produced no release tags" >&2; exit 1; }
          args=()
          for tag in "${tags[@]}"; do
            [[ "${tag}" == "${IMAGE}:"* ]] || { echo "error: tag is outside ${IMAGE}" >&2; exit 1; }
            tag_name=${tag#"${IMAGE}:"}
            [[ "${tag_name}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]] || { echo "error: invalid release tag" >&2; exit 1; }
            if [[ "${tag_name}" =~ ^sha-[0-9a-f]{40}$ ]]; then
              if output=$(docker buildx imagetools inspect "${tag}" --format '{{json .Manifest}}' 2>&1); then
                existing=$(jq -er '.digest' <<<"${output}") || { echo "error: invalid manifest for ${tag}" >&2; exit 1; }
                [ "${existing}" = "${DIGEST}" ] || { echo "error: immutable ${tag} is already ${existing}, refusing ${DIGEST}" >&2; exit 1; }
              elif ! grep -Eqi 'manifest unknown|not found|no such manifest|name unknown' <<<"${output}"; then
                echo "error: could not prove that immutable ${tag} is unused" >&2
                printf '%s\n' "${output}" >&2
                exit 1
              fi
            fi
            args+=(--tag "${tag}")
          done
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"

      - name: verify published tags
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          count=0
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            got=$(docker buildx imagetools inspect "${tag}" --format '{{json .Manifest}}' | jq -er '.digest')
            [ "${got}" = "${DIGEST}" ] || { echo "error: ${tag} resolved to ${got}, expected ${DIGEST}" >&2; exit 1; }
            count=$((count + 1))
          done <<<"${TAGS}"
          ((count > 0)) || { echo "error: no published tags were verified" >&2; exit 1; }

      - name: publish summary
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### inspr-auth published"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
