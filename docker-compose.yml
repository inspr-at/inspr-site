# inspr.at — Astro static site + INSPR foundation services.
#
# Three logical groups:
#
#   1. inspr-www    - Caddy serving one current Astro build for www.inspr.at
#                     and the three product subdomains, plus the frozen v1
#                     archive at v1.inspr.at. Catches everything on the apex
#                     EXCEPT auth paths (diverted by Traefik via priority).
#
#   2. inspr-auth   — small Go OIDC backend handling /login, /welcome, /logout.
#                     Server-side session (HMAC cookie). Talks to Zitadel via
#                     internal docker network; users only see inspr.at URLs.
#
#   3. zitadel      — the IdP itself, exposed at auth.inspr.at. Postgres-backed,
#       + zitadel-postgres   pinned (no Watchtower) so an upstream Zitadel
#                            release can't silently break the foundation.
#
# Secrets in `.env` (gitignored, deployed out-of-band to csb1):
#   ZITADEL_MASTERKEY         — 32 raw bytes for at-rest crypto (rotate = re-init)
#   ZITADEL_POSTGRES_PASSWORD — Zitadel DB user password
#   ZITADEL_ADMIN_PASSWORD    — initial console admin (zitadel-admin@inspr.localhost.zitadel)
#   OIDC_CLIENT_SECRET        — Zitadel-issued, written here AFTER bootstrap
#   COOKIE_KEY                — 64+ hex chars for inspr-auth's HMAC session

services:
  # ── 1. Static microsites + frozen v1 archive ─────────────────────────
  inspr-www:
    image: caddy:2-alpine
    container_name: inspr-www
    restart: unless-stopped
    networks:
      - traefik
    volumes:
      # deploy.sh writes immutable builds below releases/builds/, keeps an
      # append-only content-addressed asset pool in releases/assets/ and
      # atomically changes releases/current. Mounting the parent keeps symlink
      # promotion visible without restarting Caddy and preserves previous
      # releases for immediate rollback. site/ remains the stable archive.
      - ./releases:/srv/releases:ro
      - ./site:/srv/v1:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    labels:
      - traefik.enable=true
      - traefik.docker.network=csb1_traefik
      # One router per public hostname keeps certificate issuance isolated:
      # a missing product DNS record cannot block the other microsites.
      - traefik.http.routers.inspr-www.rule=Host(`www.inspr.at`)
      - traefik.http.routers.inspr-www.tls=true
      - traefik.http.routers.inspr-www.tls.certresolver=default
      - traefik.http.routers.inspr-www.middlewares=cloudflarewarp@file
      - traefik.http.routers.inspr-www.service=inspr-sites

      - traefik.http.routers.inspr-paimos.rule=Host(`paimos.inspr.at`)
      - traefik.http.routers.inspr-paimos.tls=true
      - traefik.http.routers.inspr-paimos.tls.certresolver=default
      - traefik.http.routers.inspr-paimos.middlewares=cloudflarewarp@file
      - traefik.http.routers.inspr-paimos.service=inspr-sites

      - traefik.http.routers.inspr-pharos.rule=Host(`pharos.inspr.at`)
      - traefik.http.routers.inspr-pharos.tls=true
      - traefik.http.routers.inspr-pharos.tls.certresolver=default
      - traefik.http.routers.inspr-pharos.middlewares=cloudflarewarp@file
      - traefik.http.routers.inspr-pharos.service=inspr-sites

      - traefik.http.routers.inspr-janus.rule=Host(`janus.inspr.at`)
      - traefik.http.routers.inspr-janus.tls=true
      - traefik.http.routers.inspr-janus.tls.certresolver=default
      - traefik.http.routers.inspr-janus.middlewares=cloudflarewarp@file
      - traefik.http.routers.inspr-janus.service=inspr-sites

      - traefik.http.routers.inspr-v1.rule=Host(`v1.inspr.at`)
      - traefik.http.routers.inspr-v1.tls=true
      - traefik.http.routers.inspr-v1.tls.certresolver=default
      - traefik.http.routers.inspr-v1.middlewares=cloudflarewarp@file
      - traefik.http.routers.inspr-v1.service=inspr-sites

      # Catch first-time plain-HTTP visits before HSTS can apply. One router is
      # sufficient because redirectScheme preserves the requested hostname,
      # path and query string for every public site in this deployment.
      - traefik.http.routers.inspr-sites-http.rule=Host(`inspr.at`) || Host(`www.inspr.at`) || Host(`paimos.inspr.at`) || Host(`pharos.inspr.at`) || Host(`janus.inspr.at`) || Host(`v1.inspr.at`)
      - traefik.http.routers.inspr-sites-http.entrypoints=web
      - traefik.http.routers.inspr-sites-http.middlewares=inspr-sites-https@docker
      - traefik.http.routers.inspr-sites-http.service=inspr-sites
      - traefik.http.middlewares.inspr-sites-https.redirectscheme.scheme=https
      - traefik.http.middlewares.inspr-sites-https.redirectscheme.permanent=true
      - traefik.http.middlewares.inspr-edge-hsts.headers.stsSeconds=31536000
      - traefik.http.middlewares.inspr-edge-hsts.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.inspr-edge-hsts.headers.stsPreload=true

      # Keep identity routes on the apex, but make www.inspr.at canonical for
      # all ordinary site traffic. inspr-auth wins for its paths at priority 100.
      - traefik.http.routers.inspr-apex.rule=Host(`inspr.at`)
      - traefik.http.routers.inspr-apex.tls=true
      - traefik.http.routers.inspr-apex.tls.certresolver=default
      - traefik.http.routers.inspr-apex.middlewares=inspr-edge-hsts@docker,inspr-canonical-redirect@docker,cloudflarewarp@file
      - traefik.http.routers.inspr-apex.service=inspr-sites
      - traefik.http.middlewares.inspr-canonical-redirect.redirectregex.regex=^https?://inspr\.at/(.*)
      - traefik.http.middlewares.inspr-canonical-redirect.redirectregex.replacement=https://www.inspr.at/$${1}
      - traefik.http.middlewares.inspr-canonical-redirect.redirectregex.permanent=true

      - traefik.http.services.inspr-sites.loadbalancer.server.port=80
      - com.centurylinklabs.watchtower.enable=true

  # ── 2. inspr-auth — OIDC session backend ──────────────────────────────
  # Routes /login, /welcome, /logout on inspr.at. Higher Traefik priority
  # than inspr-www so the path-prefixed rule wins despite the broader
  # Host(...) rule on inspr-www.
  inspr-auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    image: inspr-auth:local
    container_name: inspr-auth
    restart: unless-stopped
    networks:
      - traefik
    environment:
      OIDC_ISSUER: https://auth.inspr.at
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-PLACEHOLDER_set_after_bootstrap}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-PLACEHOLDER_set_after_bootstrap}
      BASE_URL: https://inspr.at
      COOKIE_KEY: ${COOKIE_KEY:?COOKIE_KEY missing — see .env.example}
      LISTEN: ":8080"
      # Zitadel management API tokens for /enter signup flow.
      # Empty values disable signup gracefully (door + login still work).
      #
      # PREFERRED: INSPR_AUTH_SA_PAT — scoped to ORG_USER_MANAGER on
      # the INSPR org, minted by auth/bootstrap-zitadel.sh step 10
      # (INSPR-162). Blast radius is bounded if the container env leaks.
      #
      # LEGACY: ZITADEL_API_PAT held the IAM_OWNER bootstrap PAT in v1.
      # Kept as a fallback during the migration window so existing
      # deploys keep working until next bootstrap re-run; main.go logs
      # the source at startup so operators can confirm the migration.
      INSPR_AUTH_SA_PAT: ${INSPR_AUTH_SA_PAT:-}
      ZITADEL_API_PAT: ${ZITADEL_API_PAT:-}
    labels:
      - traefik.enable=true
      - traefik.docker.network=csb1_traefik
      # Catch the three auth paths on inspr.at; priority 100 > inspr-www's
      # default so this rule wins even though inspr-www's Host() also
      # matches the same hostname.
      - traefik.http.routers.inspr-auth.rule=Host(`inspr.at`) && (PathPrefix(`/enter`) || PathPrefix(`/login`) || PathPrefix(`/welcome`) || PathPrefix(`/logout`))
      - traefik.http.routers.inspr-auth.priority=100
      - traefik.http.routers.inspr-auth.tls=true
      - traefik.http.routers.inspr-auth.tls.certresolver=default
      - traefik.http.routers.inspr-auth.middlewares=cloudflarewarp@file,inspr-edge-hsts@docker
      - traefik.http.services.inspr-auth.loadbalancer.server.port=8080
      # Pinned local build — Watchtower must NOT touch this (no upstream).
      - com.centurylinklabs.watchtower.enable=false

  # ── 3. Zitadel + dedicated Postgres ───────────────────────────────────
  zitadel-postgres:
    image: postgres:16-alpine
    container_name: zitadel-postgres
    restart: unless-stopped
    networks:
      - traefik
    environment:
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: ${ZITADEL_POSTGRES_PASSWORD:?missing}
      POSTGRES_DB: zitadel
    volumes:
      - zitadel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "zitadel"]
      interval: 10s
      timeout: 5s
      retries: 6
    # Pinned — never auto-update the database engine.
    labels:
      - com.centurylinklabs.watchtower.enable=false

  zitadel:
    # Zitadel publishes :stable for the latest production-tested release.
    # Watchtower is disabled below — pin to a sha digest for true repro
    # once we stabilize the configuration.
    image: ghcr.io/zitadel/zitadel:stable
    container_name: zitadel
    restart: unless-stopped
    depends_on:
      zitadel-postgres:
        condition: service_healthy
    networks:
      - traefik
    command: >
      start-from-init
      --masterkey ${ZITADEL_MASTERKEY:?missing}
      --tlsMode external
    environment:
      # ── Database wiring ────────────────────────────────
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${ZITADEL_POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # ── External-facing identity ───────────────────────
      # NOTE: changing ExternalDomain after first init requires reset.
      ZITADEL_EXTERNALDOMAIN: auth.inspr.at
      ZITADEL_EXTERNALPORT: 443
      ZITADEL_EXTERNALSECURE: "true"
      # Traefik does TLS termination; Zitadel listens HTTP on the docker net.
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_PORT: 8080
      # ── First instance bootstrap (admin user) ──────────
      # Created once on first init; subsequent restarts ignore.
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: zitadel-admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_FIRSTNAME: Zitadel
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_LASTNAME: Admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: admin@auth.inspr.at
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_NAME: INSPR
      # ── Bootstrap machine user + PAT (one-shot automation) ────────────
      # Created once at init alongside the human admin. Gets IAM_OWNER role
      # so it can call the management API for project/app/user creation.
      # PAT is written to /machinekey/pat.txt on first init; we mount that
      # path as a host volume so `bootstrap-zitadel.sh` can read it.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: bootstrap-sa
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-12-31T23:59:59Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /machinekey/pat.txt
    volumes:
      # Bind mount (not named volume) so we can chown the host dir to UID
      # 1000 — the named-volume path is root-owned at create time and
      # Zitadel's non-root container user gets EACCES at the PAT-write
      # step in migration 03_default_instance.
      - ./.machinekey:/machinekey
    labels:
      - traefik.enable=true
      - traefik.docker.network=csb1_traefik
      - traefik.http.routers.zitadel.rule=Host(`auth.inspr.at`)
      - traefik.http.routers.zitadel.tls=true
      - traefik.http.routers.zitadel.tls.certresolver=default
      - traefik.http.routers.zitadel.middlewares=cloudflarewarp@file,inspr-edge-hsts@docker
      - traefik.http.routers.zitadel-http.rule=Host(`auth.inspr.at`)
      - traefik.http.routers.zitadel-http.entrypoints=web
      - traefik.http.routers.zitadel-http.middlewares=inspr-sites-https@docker
      - traefik.http.routers.zitadel-http.service=zitadel
      - traefik.http.services.zitadel.loadbalancer.server.port=8080
      # IMPORTANT: Zitadel speaks h2c (HTTP/2 cleartext) on the backend
      # for its gRPC services. Without this, /oauth/v2/* still works (it's
      # plain HTTP/1.1), but the admin console gRPC calls fail.
      - traefik.http.services.zitadel.loadbalancer.server.scheme=h2c
      - com.centurylinklabs.watchtower.enable=false

networks:
  traefik:
    external: true
    name: csb1_traefik

volumes:
  caddy_data:
  caddy_config:
  zitadel_postgres_data:
  # Note: zitadel_machinekey was a named volume in v1; switched to a host
  # bind-mount (./.machinekey) to fix EACCES on the PAT write — see
  # comment on the zitadel service's volumes block.
