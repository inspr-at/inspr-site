services:
  inspr-www:
    image: caddy:2-alpine
    container_name: inspr-www
    restart: unless-stopped
    networks:
      - traefik
    volumes:
      - ./site:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    labels:
      - traefik.enable=true
      - traefik.docker.network=csb1_traefik
      - traefik.http.routers.inspr.rule=Host(`inspr.at`) || Host(`www.inspr.at`)
      - traefik.http.routers.inspr.tls=true
      - traefik.http.routers.inspr.tls.certresolver=default
      - traefik.http.routers.inspr.middlewares=inspr-www-redirect@docker,cloudflarewarp@file
      - traefik.http.middlewares.inspr-www-redirect.redirectregex.regex=^https?://www\.inspr\.at/(.*)
      - traefik.http.middlewares.inspr-www-redirect.redirectregex.replacement=https://inspr.at/$${1}
      - traefik.http.middlewares.inspr-www-redirect.redirectregex.permanent=true
      - traefik.http.services.inspr.loadbalancer.server.port=80
      - com.centurylinklabs.watchtower.enable=true

networks:
  traefik:
    external: true
    name: csb1_traefik

volumes:
  caddy_data:
  caddy_config:
